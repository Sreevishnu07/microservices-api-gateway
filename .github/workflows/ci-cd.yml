name: Microservices-API-Gateway

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

permissions:
  contents: read
  packages: write

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check docker compose config
        run: docker compose config

      - name: Start docker compose stack
        run: docker compose up -d --build

      - name: Wait for services to start
        run: |
          for i in {1..15}; do
            if curl -sf http://localhost/users/ > /dev/null && \
              curl -sf http://localhost/orders/ > /dev/null; then 
                echo "All services are healthy.."
                exit 0
            fi
            echo "Waiting for services to be healthy.."
            sleep 3
          done
          echo "Services failed to start.."
          exit 1

      - name: Test user service through Gateway
        run: |
          responses=$(curl -s http://localhost/users/)
          echo "$responses"
          echo "$responses" | grep "User Service"

      - name: Test order service through Gateway
        run: |
          responses=$(curl -s http://localhost/orders/)
          echo "$responses"
          echo "$responses" | grep "Order Service"

      - name: Show running containers
        run: docker ps

      - name: Show docker logs
        run: docker compose logs
  
      - name: Docker compose shutdown
        if: always()
        run: docker compose down

  build-and-push:
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tag
        id: vars
        run: echo "TAG=${{ github.sha }}">>$GITHUB_OUTPUT

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Gateway image build
        run: |
          docker build \
          -t ${{ secrets.DOCKER_USERNAME }}/revpnginx:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/revpnginx:${{ steps.vars.outputs.TAG }} ./gateway

      - name: Docker push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/revpnginx:latest
          docker push  ${{ secrets.DOCKER_USERNAME }}/revpnginx:${{ steps.vars.outputs.TAG }}
    
